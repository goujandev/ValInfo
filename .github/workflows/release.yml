name: Release

# Tag a version (git tag v0.1.0 && git push --tags) and GitHub builds the
# exe from this exact source, then attaches it to the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: |
          python tools/make_icon.py
          python -m PyInstaller --onefile --windowed --clean --noconfirm `
            --name ValInfo --icon assets/valinfo.ico `
            --add-data "assets/valinfo.ico;assets" main.py

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ValInfo.exe
          generate_release_notes: true
